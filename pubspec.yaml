name: oneir
description: Oneir — a gentle attention-protection companion app.
publish_to: "none"
version: 0.1.0

environment:
  # Bumped from >=3.3.0 for flutter_gemma (needs Dart 3.12+ / Flutter
  # 3.44+ as of its 1.0.0 release) -- everything else in this project was
  # already fine with 3.3.0, this floor is driven entirely by the new
  # on-device AI dependency below. `channel: stable` in CI is well above
  # this as of writing, so no CI changes were needed for this bump.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  uuid: ^4.5.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  home_widget: ^0.7.0
  # On-device Gemma 4 E2B via LiteRT-LM -- see lib/local_ai/ for the
  # isolated service layer and DELIVERY_NOTES / SETUP.md for what's been
  # verified vs. not. flutter_gemma is the core plugin; flutter_gemma_litertlm
  # is the opt-in package for .litertlm-format models specifically (the
  # package split into core + opt-in pieces as of its 1.0.0 release).
  flutter_gemma: ^1.5.9
  flutter_gemma_litertlm: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/poses/
    - assets/images/vanya_face/
    - assets/images/vanya_speaking/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
